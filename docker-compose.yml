version: '3.8'

services:
  # ============ KAFKA ============
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - MirrorBox

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - MirrorBox

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - MirrorBox

  # ============ WORLD SERVICE ============
  world_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: world_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - MirrorBox
    depends_on:
      - world_db
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DB_HOST=world_db

  world_http_server:
    image: nginx:alpine
    container_name: world_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - MirrorBox
    depends_on:
      - world_app

  world_db:
    image: postgres:15-alpine
    container_name: world_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_world:/var/lib/postgresql/data
    networks:
      - MirrorBox

  # Consumer - исправлен путь
  world_consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: world_consumer
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan kafka:consume
    environment:
      - KAFKA_BROKERS=kafka:9092
      - CONSUMER_TYPE=world
    networks:
      - MirrorBox
    depends_on:
      - kafka
      - world_app

networks:
  MirrorBox:
    driver: bridge

volumes:
  postgres_data_world:
    driver: local
